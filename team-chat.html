<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Team Chat — Solar360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--orange:#FF7110;--orange-light:#FF9D4D}
body{font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#F4F5F7;color:#1E1E1E;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#FF7110 0%,#FF9D4D 100%);padding:16px 20px;color:#fff;box-shadow:0 4px 20px rgba(255,113,16,.3);display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:1.25rem;font-weight:700;flex:1}
.header .online{display:flex;align-items:center;gap:5px;font-size:.75rem;opacity:.9}
.header .dot{width:8px;height:8px;border-radius:50%;background:#4caf50;box-shadow:0 0 6px rgba(76,175,80,.6)}
.back_link{display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,.9);font-size:.82rem;font-weight:600;text-decoration:none;flex-shrink:0}
.back_link svg{width:18px;height:18px}
.chat_area{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:80%;display:flex;flex-direction:column;gap:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start;align-items:flex-start}
.msg .bubble{padding:10px 14px;border-radius:16px;font-size:.88rem;line-height:1.4;word-wrap:break-word}
.msg.mine .bubble{background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.msg.other .bubble{background:#fff;color:#1E1E1E;border-bottom-left-radius:4px;box-shadow:0 2px 8px -4px rgba(0,0,0,.1)}
.msg .meta{font-size:.68rem;color:#999;padding:0 4px}
.msg .meta strong{color:#6B6B6B;font-weight:600}
.day_divider{text-align:center;font-size:.7rem;color:#999;margin:8px 0;position:relative}
.day_divider span{background:#F4F5F7;padding:0 12px;position:relative;z-index:1}
.day_divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#E0E0E0}
.spinner_wrap{text-align:center;padding:40px 20px;color:#6B6B6B}
.spinner{width:28px;height:28px;border:3px solid #E0E0E0;border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#6B6B6B;font-size:.88rem}
.empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.3}
.composer{flex-shrink:0;background:#fff;border-top:1px solid #E8E8E8;padding:10px 14px;display:flex;gap:10px;align-items:flex-end}
.composer .name_field{flex-shrink:0;width:120px}
.composer .name_field input{width:100%;padding:10px 12px;border:1px solid #E0E0E0;border-radius:20px;font-family:inherit;font-size:.82rem;color:#1E1E1E;background:#FAFAFA}
.composer .name_field input:focus{outline:none;border-color:var(--orange)}
.composer .msg_field{flex:1}
.composer .msg_field input{width:100%;padding:10px 14px;border:1px solid #E0E0E0;border-radius:20px;font-family:inherit;font-size:.88rem;color:#1E1E1E;background:#fff}
.composer .msg_field input:focus{outline:none;border-color:var(--orange)}
.send_btn{width:44px;height:44px;border:none;border-radius:50%;background:var(--orange);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.send_btn:active{transform:scale(.92)}
.send_btn:disabled{background:#ccc}
.send_btn svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="header">
  <a class="back_link" href="/dashboard"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></a>
  <h1>Team Chat</h1>
  <div class="online"><div class="dot"></div>Live</div>
</div>
<div class="chat_area" id="chatArea">
  <div class="spinner_wrap"><div class="spinner"></div>Loading messages…</div>
</div>
<div class="composer">
  <div class="name_field"><input type="text" id="nameInput" placeholder="Your name" maxlength="60"></div>
  <div class="msg_field"><input type="text" id="msgInput" placeholder="Type a message…" maxlength="2000" onkeydown="if(event.key==='Enter')send()"></div>
  <button class="send_btn" id="sendBtn" onclick="send()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>

<script>
var myName = localStorage.getItem('chat_name') || '';
document.getElementById('nameInput').value = myName;
var lastTs = null;
var pollTimer = null;

function fmtTime(iso) {
  var d = new Date(iso);
  return d.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'});
}
function fmtDay(iso) {
  var d = new Date(iso);
  var today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Today';
  var yest = new Date(); yest.setDate(yest.getDate()-1);
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', {month:'short',day:'numeric'});
}
function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function shouldShowDayDivider(msg, prevMsg) {
  if (!prevMsg) return true;
  return new Date(msg.at).toDateString() !== new Date(prevMsg.at).toDateString();
}

function renderMessages(messages, append) {
  var area = document.getElementById('chatArea');
  if (!append) {
    area.innerHTML = '';
    if (!messages.length) {
      area.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>No messages yet. Say hi to the team!</div>';
      return;
    }
  }
  if (!messages.length && !append) return;

  var html = '';
  var allMsgs = append ? messages : messages;
  for (var i = 0; i < allMsgs.length; i++) {
    var m = allMsgs[i];
    var prev = i > 0 ? allMsgs[i-1] : (append ? {at: lastTs} : null);
    if (append && i === 0 && lastTs) {
      prev = {at: lastTs};
    }
    if (shouldShowDayDivider(m, prev)) {
      html += '<div class="day_divider"><span>' + fmtDay(m.at) + '</span></div>';
    }
    var mine = m.name === myName;
    html += '<div class="msg ' + (mine ? 'mine' : 'other') + '">'
      + '<div class="bubble">' + esc(m.text) + '</div>'
      + '<div class="meta">' + (mine ? '' : '<strong>' + esc(m.name) + '</strong> · ') + fmtTime(m.at) + '</div>'
      + '</div>';
  }
  if (append) {
    area.insertAdjacentHTML('beforeend', html);
  } else {
    area.innerHTML = html;
  }
  // Scroll to bottom
  area.scrollTop = area.scrollHeight;
  if (messages.length) lastTs = messages[messages.length - 1].at;
}

async function loadMessages() {
  try {
    var url = '/api/chat/messages';
    if (lastTs) url += '?since=' + encodeURIComponent(lastTs);
    var resp = await fetch(url);
    var data = await resp.json();
    var msgs = data.messages || [];
    if (msgs.length) {
      var isFirstLoad = lastTs === null;
      renderMessages(msgs, !isFirstLoad);
    } else if (lastTs === null) {
      renderMessages([], false);
    }
  } catch(e) { /* will retry on next poll */ }
}

function send() {
  var nameEl = document.getElementById('nameInput');
  var msgEl = document.getElementById('msgInput');
  var name = nameEl.value.trim();
  var text = msgEl.value.trim();
  if (!name) { nameEl.focus(); alert('Enter your name first.'); return; }
  if (!text) return;
  myName = name;
  localStorage.setItem('chat_name', name);
  msgEl.value = '';
  msgEl.focus();

  fetch('/api/chat/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, text: text })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.ok) {
      loadMessages();
    }
  }).catch(function() {
    alert('Could not send message. Check your connection.');
    msgEl.value = text;
  });
}

// Poll for new messages every 3 seconds
loadMessages();
pollTimer = setInterval(loadMessages, 3000);
</script>
</body>
</html>
