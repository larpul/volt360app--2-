<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#f7f7f7"/>
<title>Digital Business Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Uber Move Text — Self-hosted ===== */
@font-face{
  font-family:'Uber Move Text';font-weight:300;font-style:normal;font-display:swap;
  src:url('/assets/fonts/uber-move/UberMoveTextBNG-Light.woff2') format('woff2'),
      url('/assets/fonts/uber-move/UberMoveTextBNG-Light.woff') format('woff');
}
@font-face{
  font-family:'Uber Move Text';font-weight:400;font-style:normal;font-display:swap;
  src:url('/assets/fonts/uber-move/UberMoveTextBNG-Regular.woff2') format('woff2'),
      url('/assets/fonts/uber-move/UberMoveTextBNG-Regular.woff') format('woff');
}
@font-face{
  font-family:'Uber Move Text';font-weight:500;font-style:normal;font-display:swap;
  src:url('/assets/fonts/uber-move/UberMoveTextBNG-Medium.woff2') format('woff2'),
      url('/assets/fonts/uber-move/UberMoveTextBNG-Medium.woff') format('woff');
}
@font-face{
  font-family:'Uber Move Text';font-weight:700;font-style:normal;font-display:swap;
  src:url('/assets/fonts/uber-move/UberMoveTextBNG-Bold.woff2') format('woff2'),
      url('/assets/fonts/uber-move/UberMoveTextBNG-Bold.woff') format('woff');
}

:root{
  --bg:#f7f7f7;
  --ink:#1e1e1e;
  --accent:#ed4a1d;
  --accent-bright:#ff7815;
  --gray:#4e4e4e;
  --gray-light:#6d6f72;
  --white:#fff;
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-glide:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:18px;
  line-height:1.5;
  overflow-x:hidden;
  position:relative;
}

/* ===== Card Container ===== */
.card-wrap{
  max-width:480px;
  margin:0 auto;
  background:var(--bg);
  min-height:100vh;
  position:relative;
}

/* ===== Hero Photo — Circular ===== */
.hero-photo{
  width:170px;
  height:170px;
  border-radius:50%;
  overflow:hidden;
  margin:28px auto 0;
  border:4px solid var(--accent);
  background:linear-gradient(135deg,#1e1e1e,#3a3a3a);
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.hero-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
}

/* ===== Card Content ===== */
.card-content{
  padding:0 32px 48px;
  position:relative;
}

.card-eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}
.card-eyebrow::before{
  content:'';
  width:32px;
  height:2px;
  background:var(--accent);
  flex-shrink:0;
}
.card-eyebrow span{
  font-size:11px;
  font-weight:500;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--gray-light);
}

.card-name{
  font-family:'Uber Move Text',sans-serif;
  font-weight:700;
  font-size:clamp(2rem,8vw,3.5rem);
  line-height:.95;
  letter-spacing:-.03em;
  color:var(--ink);
  margin-bottom:12px;
}

.card-title{
  font-size:clamp(.85rem,3.5vw,1.1rem);
  font-weight:700;
  color:var(--accent);
  margin-bottom:4px;
}

.card-company{
  font-size:clamp(.85rem,3.5vw,1.1rem);
  font-weight:400;
  color:var(--gray);
  margin-bottom:28px;
}

/* ===== Orange Action Bar ===== */
.action-bar{
  display:flex;
  gap:12px;
  margin-bottom:32px;
}
.action-btn{
  flex:1;
  height:56px;
  border:none;
  border-radius:28px;
  background:var(--accent-bright);
  color:var(--white);
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:500;
  letter-spacing:.02em;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .3s var(--ease-bounce),box-shadow .3s ease;
  will-change:transform;
}
.action-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(255,120,21,.35);
}
.action-btn:active{transform:translateY(0)}
.action-btn svg{width:18px;height:18px;flex-shrink:0}

/* ===== Contact Info ===== */
.contact-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.contact-row{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 0;
  text-decoration:none;
  color:var(--gray);
  border-bottom:1px solid rgba(78,78,78,.1);
  transition:color .3s ease;
}
.contact-row:last-child{border-bottom:none}
.contact-row:hover{color:var(--ink)}
.contact-row svg{
  width:20px;
  height:20px;
  flex-shrink:0;
  color:var(--gray-light);
  transition:color .3s ease;
}
.contact-row:hover svg{color:var(--accent)}
.contact-row span{
  font-size:15px;
  font-weight:400;
  word-break:break-all;
}

/* ===== Section Divider ===== */
.section-div{
  height:1px;
  background:rgba(78,78,78,.12);
  margin:40px 0;
}

/* ===== Section Label ===== */
.section-label{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}
.section-label::before{
  content:'';
  width:24px;
  height:2px;
  background:var(--accent);
  flex-shrink:0;
}
.section-label span{
  font-size:11px;
  font-weight:500;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--gray-light);
}

/* ===== Scheduler ===== */
.schedule-wrap h3{
  font-family:'Uber Move Text',sans-serif;
  font-size:clamp(1.25rem,5vw,1.75rem);
  font-weight:700;
  margin-bottom:8px;
  line-height:1.15;
  color:var(--ink);
}
.schedule-wrap>p{
  color:var(--gray-light);
  font-size:14px;
  margin-bottom:28px;
}
.schedule-dates{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:20px;
  scrollbar-width:thin;
}
.date-chip{
  flex-shrink:0;
  min-height:60px;
  min-width:60px;
  padding:10px 14px;
  border:1px solid rgba(78,78,78,.15);
  background:transparent;
  cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  border-radius:12px;
  transition:border-color .3s ease,background .3s ease,color .3s ease;
}
.date-chip:hover{border-color:var(--ink)}
.date-chip.selected{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.date-chip .dc-day{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-light)}
.date-chip.selected .dc-day{color:var(--accent-bright)}
.date-chip .dc-num{font-size:18px;font-weight:600;line-height:1}
.date-chip .dc-month{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-light)}
.date-chip.selected .dc-month{color:rgba(247,247,247,.6)}
.schedule-times{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:28px;
}
.time-chip{
  height:44px;
  border:1px solid rgba(78,78,78,.15);
  background:transparent;
  cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  color:var(--ink);
  border-radius:10px;
  transition:border-color .3s ease,background .3s ease,color .3s ease;
}
.time-chip:hover{border-color:var(--ink)}
.time-chip.selected{background:var(--accent-bright);color:var(--ink);border-color:var(--accent-bright);font-weight:600}
.time-chip:disabled{opacity:.3;cursor:not-allowed}

/* ===== Forms ===== */
.cf-field{margin-bottom:16px}
.cf-field label{
  display:block;
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--gray-light);
  margin-bottom:8px;
}
.cf-input{
  width:100%;
  height:52px;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--ink);
  padding:10px 0;
  font-family:'Space Grotesk',sans-serif;
  font-size:16px;
  color:var(--ink);
  outline:none;
  transition:border-color .3s ease;
}
.cf-input::placeholder{color:var(--gray-light);opacity:.5}
.cf-input:focus{border-bottom-color:var(--accent)}
.cf-submit{
  margin-top:20px;
  height:52px;
  padding:0 36px;
  background:var(--ink);
  color:var(--bg);
  border:none;
  border-radius:26px;
  cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  font-weight:500;
  letter-spacing:.05em;
  transition:background .3s ease,transform .3s var(--ease-bounce);
}
.cf-submit:hover{background:var(--accent)}
.cf-submit:active{transform:translateY(1px)}
.cf-success{color:var(--accent);font-weight:600;padding:16px 0;font-size:15px}

/* ===== Footer ===== */
.terminal{
  border-top:1px solid rgba(78,78,78,.1);
  padding:48px 32px 40px;
  text-align:center;
}
.terminal-meta{
  display:flex;
  justify-content:center;
  gap:32px;
  flex-wrap:wrap;
  margin-bottom:32px;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gray-light);
}
.terminal-meta span strong{color:var(--ink);font-weight:500}
.terminal-meta .live-dot{
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--accent-bright);
  border-radius:50%;
  margin-right:8px;
  vertical-align:middle;
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#qrcode{
  display:inline-block;
  margin:0 auto 24px;
  border:6px solid var(--ink);
  padding:12px;
  background:var(--bg);
  border-radius:12px;
}
#qrcode img,#qrcode canvas{display:block}
.terminal-tag{
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--gray-light);
  padding-top:24px;
  border-top:1px solid rgba(78,78,78,.08);
}

/* ===== Focus & A11y ===== */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ===== Loading ===== */
#loader{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  z-index:1000;
  transition:opacity .6s ease;
}
#loader.hide{opacity:0;pointer-events:none}
.loader-text{
  font-size:12px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--gray-light);
}
.loader-text::after{
  content:'';
  display:inline-block;
  width:8px;
  animation:dots 1.4s steps(4) infinite;
}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

/* ===== Reveal ===== */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease-glide),transform .7s var(--ease-glide)}
.reveal.in{opacity:1;transform:translateY(0)}

/* ===== Reduced Motion ===== */
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<div id="loader"><div class="loader-text">Loading</div></div>

<div id="card"></div>

<script>
(function(){
  var root=document.getElementById('card');
  var path=window.location.pathname;
  var cardId=path.indexOf('/card/')===0?decodeURIComponent(path.slice(6)):'';
  if(!cardId){cardId=new URLSearchParams(window.location.search).get('id')||'';}

  var DEMO={
    name:'Alex Morgan',title:'Architect of Ideas',company:'Studio Ephemeral',
    phone:'+1 (555) 123-4567',email:'hello@studio.com',website:'https://studio.com',
    tagline:'Designing the future, one space at a time.',
    photo:'/assets/images/card/ronald-howansky.jpg',updatedAt:new Date().toISOString()
  };

  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c];});}
  function initials(n){return String(n||'?').split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase();}

  function vcard(d){
    return 'BEGIN:VCARD\nVERSION:3.0\nFN:'+d.name+'\n'+
      (d.title?'TITLE:'+d.title+'\n':'')+
      (d.company?'ORG:'+d.company+'\n':'')+
      (d.phone?'TEL;TYPE=CELL:'+d.phone+'\n':'')+
      (d.email?'EMAIL:'+d.email+'\n':'')+
      (d.website?'URL:'+d.website+'\n':'')+
      'END:VCARD';
  }

  function render(d){
    var name=d.name||'Unknown';
    var photoHtml=d.photo
      ?'<img src="'+esc(d.photo)+'" alt="Portrait of '+esc(name)+'">'
      :'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e1e1e,#3a3a3a);color:#f7f7f7;font-family:Uber Move Text,sans-serif;font-size:6rem;font-weight:700">'+esc(initials(name))+'</div>';

    root.innerHTML=

      '<div class="card-wrap">'+

        '<div class="hero-photo">'+photoHtml+'</div>'+

        '<div class="card-content">'+
          '<div class="card-eyebrow reveal" style="margin-top:20px"><span>Digital Business Card</span></div>'+
          '<h1 class="card-name reveal">'+esc(name)+'</h1>'+
          (d.title?'<p class="card-title reveal">'+esc(d.title)+'</p>':'')+
          (d.company?'<p class="card-company reveal">'+esc(d.company)+'</p>':'')+

          '<div class="action-bar reveal">'+
            '<button class="action-btn" id="saveBtn">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>'+
              'Save to Contacts</button>'+
            '<button class="action-btn" id="shareBtn">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>'+
              'Share</button>'+
          '</div>'+

          '<div class="contact-info reveal">'+
            (d.phone?'<a class="contact-row" href="tel:'+esc(d.phone)+'">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>'+
              '<span>'+esc(d.phone)+'</span></a>':'')+
            (d.email?'<a class="contact-row" href="mailto:'+esc(d.email)+'">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>'+
              '<span>'+esc(d.email)+'</span></a>':'')+
            (d.website?'<a class="contact-row" href="'+esc(d.website)+'" target="_blank" rel="noopener">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>'+
              '<span>'+esc(d.website.replace(/^https?:\/\//,''))+'</span></a>':'')+
          '</div>'+
        '</div>'+

        '<div class="card-content">'+
          '<div class="section-div"></div>'+

          '<section class="reveal" id="schedule">'+
            '<div class="section-label"><span>Smart Scheduling</span></div>'+
            '<div class="schedule-wrap">'+
              '<h3>Book a Meeting</h3>'+
              '<p>Select a date and time that works for you.</p>'+
              '<div class="schedule-dates" id="scheduleDates"></div>'+
              '<div class="schedule-times" id="scheduleTimes"></div>'+
              '<form id="scheduleForm">'+
                '<div class="cf-field"><label for="sf-name">Your Name</label><input class="cf-input" id="sf-name" type="text" placeholder="Jane Doe" autocomplete="name" required></div>'+
                '<div class="cf-field"><label for="sf-email">Your Email</label><input class="cf-input" id="sf-email" type="email" placeholder="jane@example.com" autocomplete="email" required></div>'+
                '<button class="cf-submit" type="submit" id="sf-submit">Confirm Booking</button>'+
              '</form>'+
            '</div>'+
          '</section>'+

          '<div class="section-div"></div>'+

          '<section class="reveal">'+
            '<div class="section-label"><span>Request a callback</span></div>'+
            '<form id="contactForm">'+
              '<p style="color:var(--gray-light);font-size:14px;margin-bottom:24px">Leave your details and '+esc(name.split(' ')[0])+' will reach out shortly.</p>'+
              '<div class="cf-field"><label for="cf-name">Your Name</label><input class="cf-input" id="cf-name" type="text" placeholder="Jane Doe" autocomplete="name"></div>'+
              '<div class="cf-field"><label for="cf-phone">Your Phone</label><input class="cf-input" id="cf-phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel"></div>'+
              '<button class="cf-submit" type="submit">Send Request</button>'+
            '</form>'+
          '</section>'+
        '</div>'+

        '<footer class="terminal reveal">'+
          '<div class="terminal-meta">'+
            '<span><span class="live-dot"></span><strong id="liveTime">\u2014</strong></span>'+
            '<span>Location: <strong>'+(d.company||'\u2014')+'</strong></span>'+
            (d.updatedAt?'<span>Updated: <strong>'+new Date(d.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</strong></span>':'')+
          '</div>'+
          '<div id="qrcode" aria-label="QR code linking to this card"></div>'+
          '<div class="terminal-tag">Powered by Volt360</div>'+
        '</footer>'+

      '</div>';

    // Hide loader
    document.getElementById('loader').classList.add('hide');

    // --- Save Contact (VCF) ---
    var saveBtn=document.getElementById('saveBtn');
    if(saveBtn) saveBtn.addEventListener('click',function(){
      var blob=new Blob([vcard(d)],{type:'text/vcard'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=(name||'contact')+'.vcf';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // --- Share ---
    var shareBtn=document.getElementById('shareBtn');
    if(shareBtn) shareBtn.addEventListener('click',function(){
      if(cardId){
        fetch('/api/card/share/'+encodeURIComponent(cardId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:navigator.share?'native':'clipboard'})}).catch(function(){});
      }
      var shareData={title:name,text:(d.title||'')+(d.company?' at '+d.company:''),url:window.location.href};
      if(navigator.share){navigator.share(shareData).catch(function(){});}
      else{navigator.clipboard.writeText(window.location.href).then(function(){alert('Link copied to clipboard');}).catch(function(){});}
    });

    // --- Contact form ---
    var form=document.getElementById('contactForm');
    if(form) form.addEventListener('submit',function(e){
      e.preventDefault();
      var phone=document.getElementById('cf-phone').value.trim();
      var visitorName=document.getElementById('cf-name').value.trim();
      if(!phone) return;
      var btn=form.querySelector('.cf-submit');
      btn.disabled=true;btn.textContent='Sending\u2026';
      if(cardId){
        fetch('/api/card/contact/'+encodeURIComponent(cardId),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({phone:phone,name:visitorName})
        }).then(function(r){return r.json()}).then(function(res){
          if(res.ok){form.innerHTML='<div class="cf-success">Thanks! '+esc(name.split(' ')[0])+' will reach out soon.</div>';}
          else{btn.disabled=false;btn.textContent='Send Request';alert('Could not send. Please try again.');}
        }).catch(function(){btn.disabled=false;btn.textContent='Send Request';alert('Could not send. Please try again.');});
      } else {
        form.innerHTML='<div class="cf-success">Thanks! '+esc(name.split(' ')[0])+' will reach out soon.</div>';
      }
    });

    // --- Scheduler ---
    var selectedDate=null,selectedTime=null,selectedDateLabel='';

    var datesEl=document.getElementById('scheduleDates');
    if(datesEl){
      var today=new Date();
      for(var i=0;i<14;i++){
        (function(i){
          var dd=new Date(today);dd.setDate(dd.getDate()+i);
          var dn=dd.toLocaleDateString('en-US',{weekday:'short'});
          var dnum=dd.getDate();
          var dm=dd.toLocaleDateString('en-US',{month:'short'});
          var chip=document.createElement('button');
          chip.type='button';chip.className='date-chip';
          chip.innerHTML='<span class="dc-day">'+dn+'</span><span class="dc-num">'+dnum+'</span><span class="dc-month">'+dm+'</span>';
          chip.addEventListener('click',function(){
            document.querySelectorAll('.date-chip').forEach(function(c){c.classList.remove('selected')});
            chip.classList.add('selected');
            selectedDate=dd.toISOString().split('T')[0];
            selectedDateLabel=dd.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
          });
          datesEl.appendChild(chip);
        })(i);
      }
    }

    var timesEl=document.getElementById('scheduleTimes');
    if(timesEl){
      var slots=['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM','3:00 PM','3:30 PM','4:00 PM','4:30 PM'];
      slots.forEach(function(slot){
        var chip=document.createElement('button');
        chip.type='button';chip.className='time-chip';chip.textContent=slot;
        chip.addEventListener('click',function(){
          document.querySelectorAll('.time-chip').forEach(function(c){c.classList.remove('selected')});
          chip.classList.add('selected');selectedTime=slot;
        });
        timesEl.appendChild(chip);
      });
    }

    var scheduleForm=document.getElementById('scheduleForm');
    if(scheduleForm) scheduleForm.addEventListener('submit',function(e){
      e.preventDefault();
      if(!selectedDate||!selectedTime){alert('Please select a date and time.');return;}
      var vn=document.getElementById('sf-name').value.trim();
      var ve=document.getElementById('sf-email').value.trim();
      if(!vn||!ve) return;
      var btn=document.getElementById('sf-submit');
      btn.disabled=true;btn.textContent='Confirming\u2026';
      function success(){
        scheduleForm.innerHTML='<div class="cf-success">Booking confirmed for '+esc(selectedDateLabel)+' at '+esc(selectedTime)+'. A confirmation will be sent to '+esc(ve)+'.</div>';
      }
      if(cardId){
        fetch('/api/card/book/'+encodeURIComponent(cardId),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({date:selectedDateLabel,time:selectedTime,name:vn,email:ve})
        }).then(function(r){return r.json()}).then(function(res){
          if(res.ok) success();
          else{btn.disabled=false;btn.textContent='Confirm Booking';alert('Could not book. Please try again.');}
        }).catch(function(){btn.disabled=false;btn.textContent='Confirm Booking';alert('Could not book. Please try again.');});
      } else success();
    });

    // --- QR Code ---
    try{
      new QRCode(document.getElementById('qrcode'),{
        text:window.location.href,width:180,height:180,
        colorDark:'#1e1e1e',colorLight:'#f7f7f7'
      });
    }catch(e){/* QR lib may not be loaded */}

    // --- Live clock ---
    function tick(){
      var el=document.getElementById('liveTime');
      if(el) el.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    tick();setInterval(tick,1000);

    // --- Scroll reveal ---
    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){entry.target.classList.add('in');observer.unobserve(entry.target);}
      });
    },{threshold:0.12});
    document.querySelectorAll('.reveal').forEach(function(el){observer.observe(el);});
  }

  // Fetch card data or fall back to demo
  if(cardId){
    fetch('/api/card/scan/'+encodeURIComponent(cardId),{method:'POST'})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d&&d.ok){render(d);}
        else{render(DEMO);}
      })
      .catch(function(){render(DEMO);});
  } else {
    render(DEMO);
  }
})();
</script>
</body>
</html>
