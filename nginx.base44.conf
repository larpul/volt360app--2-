server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and uploaded-file routes proxy to the Node backend.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Public digital business card page — served standalone (no Angular app).
    location ^~ /card {
        try_files /card.html =404;
    }

    # JS chunks are edited in-place during development — don't let the browser cache stale copies.
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # SPA fallback: serve the real file if it exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
