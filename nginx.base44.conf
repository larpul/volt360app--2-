server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and uploaded-file routes proxy to the Node backend.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Public digital business card page — served standalone (no Angular app).
    location ^~ /card {
        try_files /card.html =404;
    }

    # Card activity analytics page — standalone (scan & share log with CSV download).
    location ^~ /analytics {
        try_files /analytics.html =404;
    }

    # Sales reps directory — standalone page.
    location ^~ /sales-reps {
        try_files /sales-reps.html =404;
    }

    # Team chat — standalone page.
    location ^~ /team-chat {
        try_files /team-chat.html =404;
    }

    # WebSocket endpoint for real-time team chat.
    location /api/chat/ws {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # JS chunks are edited in-place during development — don't let the browser cache stale copies.
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # SPA fallback: serve the real file if it exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
