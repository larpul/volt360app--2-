server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and uploaded-file routes proxy to the Node backend.
    # A variable in proxy_pass + the Docker resolver above means nginx re-resolves
    # the `api` hostname on every request, so a recreated api container (new IP)
    # is picked up immediately instead of causing 502s.
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Public digital business card page — served standalone (no Angular app).
    location ^~ /card {
        try_files /card.html =404;
    }

    # Card activity analytics page — standalone (scan & share log with CSV download).
    location ^~ /analytics {
        try_files /analytics.html =404;
    }

    # JS chunks are edited in-place during development — don't let the browser cache stale copies.
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~* \.css$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images are replaced in-place too (e.g. the profile photo) — always revalidate.
    location ~* \.(png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: serve the real file if it exists, otherwise index.html.
    # The HTML shell is edited in place too, so it must always revalidate — a
    # cached copy keeps pointing at stale bundle versions.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
