# ── HTTP: Let's Encrypt challenge + redirect to HTTPS ──
server {
    listen 80;
    server_name volt360solar.com www.volt360solar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://volt360solar.com$request_uri;
    }
}

# ── HTTPS: www → apex redirect ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.volt360solar.com;

    ssl_certificate     /etc/letsencrypt/live/volt360solar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volt360solar.com/privkey.pem;

    return 301 https://volt360solar.com$request_uri;
}

# ── HTTPS: main app ──
server {
    listen 443 ssl;
    http2 on;
    server_name volt360solar.com;

    ssl_certificate     /etc/letsencrypt/live/volt360solar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volt360solar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    root /usr/share/nginx/html;
    index index.html;

    # API and uploaded-file routes proxy to the Node backend.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Public digital business card page.
    location ^~ /card {
        try_files /card.html =404;
    }

    # Card activity analytics page.
    location ^~ /analytics {
        try_files /analytics.html =404;
    }

    # JS chunks — moderate cache (no content hashes in filenames).
    location ~* \.js$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri /index.html;
    }

    # Static assets — long cache.
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=30d";
        try_files $uri /index.html;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
