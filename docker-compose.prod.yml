name: solar360-prod

services:
  # nginx: serves the static SPA + proxies /api and /uploads to the Node backend.
  # Handles SSL termination with Let's Encrypt certificates.
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.prod.main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Node.js backend: uploads, AI assistant, roof scan, bill analysis.
  api:
    image: node:22-slim
    working_dir: /app
    command: ["node", "server/uploads-server.js"]
    environment:
      - PORT=4000
      - DATA_DIR=/data/uploads
    env_file:
      - .env.prod
    volumes:
      - ./:/app:ro
      - uploads_data:/data/uploads
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Certbot: auto-renews Let's Encrypt certificates every 12 hours.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait; certbot renew --webroot -w /var/www/certbot --quiet; done"
    restart: on-failure

volumes:
  uploads_data:
